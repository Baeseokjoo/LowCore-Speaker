<head><meta charset="utf-8"><title>PlayControl — preview</title>

<body>
<div id="root" class="lc-stage" style=""></div>
<script>
var L = window.LowCore, h = React.createElement;
function Demo(){ var s=React.useState(false),p=s[0],set=s[1];
  return h('div',{style:{maxWidth:360,padding:16,borderRadius:20,background:'var(--surface-image-bottom)'}},h(L.PlayControl,{playing:p,progress:p?42:0,onToggle:function(){set(!p);}})); }
