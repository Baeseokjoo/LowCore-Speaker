<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div id="root" class="lc-stage" style=""></div>
<script>
var L = window.LowCore, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'lc-row', style: { gap: 24 } },
    h(L.Button, { variant: 'primary', size: 'lg', icon: 'arrow-down', breathe: true }, '체험 시작'),
    h(L.Button, { variant: 'primary' }, '구매'),
    h(L.Button, { variant: 'ghost' }, '체험하기'),
    h(L.Button, { variant: 'ghost', size: 'sm' }, '닫기')));
</script>
</body>
</html>
