<head><meta charset="utf-8"><title>DetailPanel — preview</title>

<body>
<div id="root" class="lc-stage" style=""></div>
<script>
var L = window.LowCore, h = React.createElement;
function Demo(){ var s=React.useState(false),o=s[0],set=s[1];
  return h('div',null,
    h(L.DetailPanel,{kind:'5',name:'5인치 모델',imageSide:'left',onBuy:function(){set(true);},onTry:function(e){e.preventDefault();}},

    h(L.Dialog,{open:o,title:'준비 중입니다',onClose:function(){set(false);}},'실습용 사이트로 구매가 불가합니다.')); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
