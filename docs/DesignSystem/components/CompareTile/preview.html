<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>CompareTile — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div id="root" class="lc-stage" style=""></div>
<script>
var L = window.LowCore, h = React.createElement;
function Demo(){ var s=React.useState('5'),sel=s[0],set=s[1]; var q=React.useState(false),pl=q[0],setPl=q[1];
  function st(k){ return sel==='none' ? 'idle' : (sel===k ? 'selected' : 'dimmed'); }
  return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:24,padding:'8px 12px'}},
    ['pc','5','8'].map(function(k){ return h(L.CompareTile,{key:k,kind:k,state:st(k),playing:pl,progress:pl?35:0,
      onSelect:function(){ setPl(false); set(sel===k?'none':k); }, onToggle:function(){ setPl(!pl); }}); })); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
